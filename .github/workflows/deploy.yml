name: Deploy Plasmic static to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # <<=== было 18, ставим 22
          cache: 'npm'

      - name: Install deps
        run: npm install

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Build (vite)
        run: npm run build

      - name: Export static (snap.mjs)
        run: node snap.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

